name: health_companion
description: ForeverFit — offline-first health & disaster-resilience app (SIH '26 #26181).
publish_to: 'none'
version: 1.0.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_litert: ^3.8.0
  sensors_plus: ^7.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_map_cache: ^2.1.0
  http_cache_core: ^1.1.4
  http_cache_file_store: ^2.0.2
  path_provider: ^2.1.6
  geolocator: ^14.0.3
  http: ^1.6.0
  audioplayers: ^6.8.1
  pedometer: ^4.2.0
  flutter_local_notifications: ^22.3.0
  flutter_tts: ^4.2.5
  saf_util: ^3.1.0
  saf_stream: ^4.0.1
  flutter_foreground_task: ^11.0.3
  flutter_contacts: ^2.3.1
  package_info_plus: ^10.2.1
  flutter_gemma: ^1.7.3
  flutter_gemma_litertlm: ^1.6.3
  connectivity_plus: ^6.1.5
  url_launcher: ^6.3.1
  image_picker: ^1.2.3
  file_picker: ^12.2.0
  syncfusion_flutter_pdf: ^34.2.7
  speech_to_text: ^7.4.0
  flutter_displaymode: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  # Regenerate with `dart run flutter_launcher_icons` after changing
  # either source image. LoadingScreen reads the resulting launcher icon
  # live from the OS at runtime (see app_icon_service.dart) rather than
  # bundling a separate copy, so it updates automatically too.
  android: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#C1622A"
  adaptive_icon_foreground: assets/icon/icon_foreground.png

flutter:
  uses-material-design: true
  assets:
    - assets/models/fall_detector.tflite
    - assets/icon/
    - assets/models/fall_detector_phone_only.tflite
    - assets/models/activity_classifier.tflite
    - assets/sounds/alarm_siren.wav
  fonts:
    # Bundled locally (not fetched from Google Fonts at runtime) — matches
    # this app's offline-first rule everywhere else. One variable-weight
    # TTF (200-1000 weight axis) declared at several logical weights, the
    # standard Flutter pattern for a single variable font file — see
    # assets/fonts/OFL.txt for the license.
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 500
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 600
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 700
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 800
        - asset: assets/fonts/Nunito-Variable.ttf
          weight: 900
