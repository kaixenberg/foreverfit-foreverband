name: health_companion
description: Personal Health Companion — offline-first health & disaster-resilience app (SIH '26 #26181).
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_blue_plus: ^1.32.12
  provider: ^6.1.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  permission_handler: ^11.3.1
  fl_chart: ^0.68.0
  intl: ^0.19.0
  flutter_litert: ^3.8.0
  sensors_plus: ^7.1.0
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_map_cache: ^2.1.0
  http_cache_core: ^1.1.4
  http_cache_file_store: ^2.0.2
  path_provider: ^2.1.6
  geolocator: ^14.0.3
  http: ^1.6.0
  audioplayers: ^6.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/fall_detector.tflite
    - assets/models/fall_detector_phone_only.tflite
    - assets/models/activity_classifier.tflite
    - assets/sounds/alarm_siren.wav
